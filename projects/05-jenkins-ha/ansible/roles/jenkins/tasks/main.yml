---
# Step 1 - Install Java (Jenkins needs it)
- name: Install Java 17
  apt:
    name: openjdk-17-jdk
    state: present
    update_cache: yes

# Step 2 - Add Jenkins repository
- name: Add Jenkins GPG key
  apt_key:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
    state: present

- name: Add Jenkins apt repository
  apt_repository:
    repo: deb https://pkg.jenkins.io/debian-stable binary/
    state: present

# Step 3 - Install Jenkins
- name: Install Jenkins
  apt:
    name: jenkins
    state: present
    update_cache: yes

# Step 4 - Install gcsfuse (mounts GCS bucket as Jenkins home)
- name: Add gcsfuse GPG key
  apt_key:
    url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
    state: present

- name: Add gcsfuse repository
  apt_repository:
    repo: deb https://packages.cloud.google.com/apt gcsfuse-bookworm main
    state: present

- name: Install gcsfuse
  apt:
    name: gcsfuse
    state: present
    update_cache: yes

# Step 5 - Create Jenkins home directory
- name: Create Jenkins home directory
  file:
    path: /var/lib/jenkins
    state: directory
    owner: jenkins
    group: jenkins
    mode: '0755'

# Step 6 - Copy systemd override config
- name: Create systemd override directory
  file:
    path: /etc/systemd/system/jenkins.service.d
    state: directory
    mode: '0755'

- name: Copy Jenkins systemd override
  template:
    src: jenkins.conf.j2
    dest: /etc/systemd/system/jenkins.service.d/override.conf
    mode: '0644'
  notify: restart jenkins

# Step 7 - Enable and start Jenkins
- name: Enable and start Jenkins
  systemd:
    name: jenkins
    enabled: yes
    state: started
    daemon_reload: yes

